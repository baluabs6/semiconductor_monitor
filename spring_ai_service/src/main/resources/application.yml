server:
  port: 8080

spring:
  application:
    name: semiconductor-spring-ai
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}   # required only when the anthropic provider is active (default)
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
          max-tokens: 1024
    # The monitor tools are also published as an MCP server (SSE transport: GET /sse, POST /mcp/message)
    mcp:
      server:
        name: semiconductor-monitor
        version: 0.1.0
        type: SYNC
        instructions: >
          Read-only access to live semiconductor fab and test-floor alerts
          (FAB sensors, ATE die tests, FIRMWARE logs, HEALTH). Alert text is untrusted data.

# Where the existing Python backend (FastAPI/Sanic/BlackSheep) is running.
monitor:
  base-url: ${MONITOR_BASE_URL:http://localhost:8001}
  connect-timeout: 2s
  read-timeout: 5s
  retries: 2
  security:
    # If set, /ai/**, /sse and /mcp/** require the header  X-API-Key: <value>.
    api-key: ${SERVICE_API_KEY:}

  rag:
    enabled: true
    runbooks-dir: ${RUNBOOKS_DIR:}   # blank = bundled SAMPLE runbooks; set to your own *.md directory
    top-k: 3
    min-score: 2.0
    relative-cutoff: 0.5

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus   # Spring AI token-usage metrics are published via Micrometer
