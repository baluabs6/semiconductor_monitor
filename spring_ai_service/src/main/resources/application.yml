server:
  port: 8080

spring:
  application:
    name: semiconductor-spring-ai
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
          max-tokens: 1024

# Where the existing Python backend (FastAPI/Sanic/BlackSheep) is running.
monitor:
  base-url: ${MONITOR_BASE_URL:http://localhost:8001}
